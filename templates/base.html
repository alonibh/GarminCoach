<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GarminCoach{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version() }}">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#0b1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header>
    <a href="/" class="brand"><span class="brand-mark">GC</span><span>GarminCoach</span></a>
    <button class="hamburger" type="button" aria-label="Open menu" aria-controls="primary-navigation" aria-expanded="false">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <nav id="primary-navigation" aria-label="Primary navigation">
      <a href="/">Dashboard</a>
      <a href="/calendar">Calendar</a>
      <a href="/program">Plan</a>
      {% if multi_user_enabled %}<a href="/account">Account</a>{% endif %}
      {% if multi_user_enabled %}
      <form method="post" action="/auth/logout" style="display:inline"><button type="submit" class="logout-link" style="background:none;border:0;font:inherit;cursor:pointer">Sign out</button></form>
      {% else %}
      <a href="/app-logout" class="logout-link">Sign out</a>
      {% endif %}
    </nav>
  </header>
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>
  <script>
    (() => {
      const header = document.querySelector('header');
      const toggle = document.querySelector('.hamburger');
      const nav = document.getElementById('primary-navigation');
      if (!header || !toggle || !nav) return;

      const setMenuOpen = (open) => {
        nav.classList.toggle('open', open);
        toggle.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        document.body.classList.toggle('nav-open', open && window.innerWidth <= 768);
      };

      toggle.addEventListener('click', () => {
        setMenuOpen(toggle.getAttribute('aria-expanded') !== 'true');
      });
      nav.addEventListener('click', (event) => {
        if (event.target.closest('a')) setMenuOpen(false);
      });
      document.addEventListener('click', (event) => {
        if (toggle.getAttribute('aria-expanded') === 'true' && !header.contains(event.target)) {
          setMenuOpen(false);
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
          setMenuOpen(false);
          toggle.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) setMenuOpen(false);
      });
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js');
      });
    }
  </script>
</body>
</html>
