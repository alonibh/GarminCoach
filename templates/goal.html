{% extends "base.html" %}
{% block title %}Goal - GarminCoach{% endblock %}

{% block content %}
<div class="content-header">
  <div class="header-left">
    <h1>Training Goal</h1>
    <p class="muted">Set the goal GarminCoach should use for workout planning and Telegram coaching.</p>
  </div>
</div>

<div class="card section-card">
  <form method="post" action="/goal" class="form-section">
    <label class="field">Primary goal
      <input
        type="text"
        name="goal"
        value="{{ goal.goal }}"
        placeholder="Run a sub-20 5K, build muscle, maintain fitness"
      >
    </label>

    <label class="field">Constraints and preferences
      <textarea
        name="custom_input"
        rows="5"
        placeholder="Training days, injuries, preferred session times, or anything the coach should respect."
      >{{ goal.custom_input }}</textarea>
    </label>

    <div class="toolbar">
      <span class="muted">You can update this anytime.</span>
      <button type="submit" class="btn">Save goal</button>
    </div>
  </form>
</div>
{% endblock %}
