name: Production Runtime Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production runtime
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            cd /home/ubuntu/garmincoach
            echo "DEPLOYED_SHA=$(git rev-parse HEAD)"
            previous_exec_start=$(sudo systemctl show garmincoach -p ExecStart --value)
            active_env=$(printf '%s\n' "$previous_exec_start" | grep -oE '/home/ubuntu/garmincoach/\.venv[^/[:space:]]*/bin/' | head -n 1 | sed 's#/bin/$##' || true)
            if [ -z "$active_env" ] || [ ! -d "$active_env" ]; then
              active_env="/home/ubuntu/garmincoach/.venv"
            fi
            echo "ACTIVE_ENV=$active_env"
            "$active_env/bin/python" scripts/verify_production_setup.py
