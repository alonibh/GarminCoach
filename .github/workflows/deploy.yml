name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest -ra --tb=short --junitxml=test-results/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-${{ github.run_id }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TARGET_SHA
          script: |
            set -Eeuo pipefail
            cd ~/garmincoach
            previous_sha=$(git rev-parse HEAD)

            rollback() {
              exit_code=$?
              if [ "$exit_code" -ne 0 ]; then
                echo "Deployment failed; rolling back to $previous_sha"
                git reset --hard "$previous_sha"
                source .venv/bin/activate
                python -m pip install -r requirements.txt
                sudo systemctl restart garmincoach
                sudo systemctl is-active --quiet garmincoach
              fi
              exit "$exit_code"
            }
            trap rollback EXIT

            git fetch origin "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"
            source .venv/bin/activate
            python -m pip install -r requirements.txt
            # The exact SHA already passed the isolated Linux test job. On the
            # production host, use a side-effect-free smoke check instead of
            # loading test modules with live Garmin/calendar credentials.
            python -m compileall -q app.py config.py db.py time_utils.py coach metrics notify sync
            python -c "import app"
            chmod +x fix_timeouts.sh
            ./fix_timeouts.sh
            sudo systemctl restart garmincoach
            sudo systemctl is-active --quiet garmincoach

            healthy=false
            # The first Ask Coach startup streams verified backups and runs
            # integrity checks for every tenant database before accepting
            # traffic. Give that fail-closed migration enough time to finish.
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/ > /dev/null; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo "Health check failed after 60 attempts"
              sudo systemctl status garmincoach --no-pager --full || true
              sudo journalctl -u garmincoach -n 100 --no-pager || true
              exit 1
            fi

            trap - EXIT
            echo "Deployment of $TARGET_SHA completed successfully"
