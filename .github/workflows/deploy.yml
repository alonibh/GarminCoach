name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest -ra --tb=short --junitxml=test-results/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-${{ github.run_id }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TARGET_SHA
          script: |
            set -Eeuo pipefail
            project_dir=/home/ubuntu/garmincoach
            cd "$project_dir"
            previous_sha=$(git rev-parse HEAD)
            original_env="$project_dir/.venv"
            previous_exec_start=$(sudo systemctl show garmincoach -p ExecStart --value)
            previous_env=$(printf '%s\n' "$previous_exec_start" | grep -oE '/home/ubuntu/garmincoach/\.venv[^/[:space:]]*/bin/' | head -n 1 | sed 's#/bin/$##' || true)
            if [ -z "$previous_env" ] || [ ! -d "$previous_env" ]; then
              echo "Could not determine the currently active virtual environment from systemd ExecStart"
              exit 1
            fi
            case "$previous_env" in
              "$project_dir"/.venv|"$project_dir"/.venv-garminconnect-037-*) ;;
              *)
                echo "Refusing deployment: active virtual environment is outside the approved project paths: $previous_env"
                exit 1
                ;;
            esac
            candidate_env="$PWD/.venv-garminconnect-037-${TARGET_SHA}"
            runtime_override=/etc/systemd/system/garmincoach.service.d/runtime.conf
            previous_override=$(mktemp)
            had_runtime_override=false
            if sudo test -f "$runtime_override"; then
              sudo cp "$runtime_override" "$previous_override"
              had_runtime_override=true
            fi

            rollback() {
              exit_code=$?
              if [ "$exit_code" -ne 0 ]; then
                echo "Deployment failed; rolling back to $previous_sha and $previous_env"
                git reset --hard "$previous_sha"
                if [ "$had_runtime_override" = true ]; then
                  sudo install -d /etc/systemd/system/garmincoach.service.d
                  sudo cp "$previous_override" "$runtime_override"
                else
                  sudo rm -f "$runtime_override"
                fi
                sudo systemctl daemon-reload
                sudo systemctl restart garmincoach
                sudo systemctl is-active --quiet garmincoach
              fi
              rm -f "$previous_override"
              exit "$exit_code"
            }
            trap rollback EXIT

            git fetch origin "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"
            if [ ! -x "$original_env/bin/python" ]; then
              echo "Existing production virtual environment is missing"
              exit 1
            fi
            if [ -e "$candidate_env" ]; then
              echo "Candidate environment already exists: $candidate_env"
              exit 1
            fi
            cp -a "$original_env" "$candidate_env"
            "$candidate_env/bin/python" -c "import sys; assert sys.version_info[:2] == (3, 12)"
            "$candidate_env/bin/python" -m pip install -r requirements.txt
            "$candidate_env/bin/python" -c "from importlib.metadata import version; assert version('garminconnect') == '0.3.7'; import garminconnect.typed"
            "$candidate_env/bin/python" -m compileall -q app.py config.py db.py time_utils.py coach metrics notify sync
            "$candidate_env/bin/python" -c "import app"
            "$candidate_env/bin/python" -m pytest -ra --tb=short tests/compat tests/test_garmin_compat_probe.py

            sudo install -d /etc/systemd/system/garmincoach.service.d
            sudo tee "$runtime_override" > /dev/null <<EOF
            [Service]
            ExecStart=
            ExecStart=$candidate_env/bin/uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
            EOF
            sudo systemctl daemon-reload
            chmod +x fix_timeouts.sh
            ./fix_timeouts.sh
            sudo systemctl restart garmincoach
            sudo systemctl is-active --quiet garmincoach

            healthy=false
            # The first Ask Coach startup streams verified backups and runs
            # integrity checks for every tenant database before accepting
            # traffic. Give that fail-closed migration enough time to finish.
            for attempt in $(seq 1 60); do
              status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
              if [ "$status" = "200" ]; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo "Health check failed after 60 attempts"
              sudo systemctl status garmincoach --no-pager --full || true
              sudo journalctl -u garmincoach -n 100 --no-pager || true
              exit 1
            fi

            python_version=$("$candidate_env/bin/python" --version)
            garminconnect_version=$("$candidate_env/bin/python" -c "from importlib.metadata import version; print(version('garminconnect'))")
            echo "Deployment details: sha=$TARGET_SHA active_env=$candidate_env python=$python_version garminconnect=$garminconnect_version rollback_env=$previous_env"
            echo "Pruning obsolete deployment environments; retaining active=$candidate_env rollback=$previous_env original=$original_env"
            while IFS= read -r -d '' obsolete_env; do
              case "$obsolete_env" in
                "$candidate_env"|"$previous_env"|"$original_env")
                  echo "Retaining environment: $obsolete_env"
                  ;;
                "$project_dir"/.venv-garminconnect-037-*)
                  echo "Deleting obsolete environment: $obsolete_env"
                  rm -rf -- "$obsolete_env"
                  ;;
                *)
                  echo "Refusing to delete unexpected path: $obsolete_env"
                  exit 1
                  ;;
              esac
            done < <(find "$project_dir" -mindepth 1 -maxdepth 1 -type d -name '.venv-garminconnect-037-*' -print0)

            trap - EXIT
            echo "Deployment of $TARGET_SHA completed successfully"
